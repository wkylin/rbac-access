<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" role="img" aria-labelledby="title desc">
  <title id="title">一次访问的权限判定流程</title>
  <desc id="desc">账号有效、角色持有权限、同一角色的资源范围匹配后才允许访问；不能跨角色拼接条件。</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#f5faff"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="result" x2="1" y2="1">
      <stop stop-color="#155b9d"/>
      <stop offset="1" stop-color="#103b70"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#73b5d9" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="348" rx="22" fill="url(#canvas)"/>
  <text x="36" y="43" fill="#176e9e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ACCESS CHECK</text>
  <text x="36" y="78" fill="#163450" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700">一次请求，要过四道门</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="36" y="113" width="250" height="153" rx="15" fill="#fff" stroke="#cfe3f2"/>
    <rect x="55" y="132" width="37" height="28" rx="7" fill="#dff4f5"/>
    <text x="73.5" y="151" text-anchor="middle" fill="#147d90" font-size="14" font-weight="700">01</text>
    <text x="55" y="191" fill="#173551" font-size="22" font-weight="700">账号有效</text>
    <text x="55" y="227" fill="#58718a" font-size="16">登录员工处于启用状态</text>

    <rect x="329" y="113" width="250" height="153" rx="15" fill="#fff" stroke="#cfe3f2"/>
    <rect x="348" y="132" width="37" height="28" rx="7" fill="#e4efff"/>
    <text x="366.5" y="151" text-anchor="middle" fill="#246db1" font-size="14" font-weight="700">02</text>
    <text x="348" y="191" fill="#173551" font-size="22" font-weight="700">持有权限</text>
    <text x="348" y="227" fill="#58718a" font-size="16">角色与权限项均已启用</text>

    <rect x="622" y="113" width="250" height="153" rx="15" fill="#fff" stroke="#cfe3f2"/>
    <rect x="641" y="132" width="37" height="28" rx="7" fill="#e4efff"/>
    <text x="659.5" y="151" text-anchor="middle" fill="#246db1" font-size="14" font-weight="700">03</text>
    <text x="641" y="191" fill="#173551" font-size="22" font-weight="700">范围匹配</text>
    <text x="641" y="227" fill="#58718a" font-size="16">同一角色匹配目标资源</text>

    <rect x="915" y="113" width="250" height="153" rx="15" fill="url(#result)"/>
    <rect x="934" y="132" width="37" height="28" rx="7" fill="#2b81b9"/>
    <text x="952.5" y="151" text-anchor="middle" fill="#e8faff" font-size="14" font-weight="700">04</text>
    <text x="934" y="191" fill="#fff" font-size="22" font-weight="700">允许访问</text>
    <text x="934" y="227" fill="#c7e3f7" font-size="16">否则返回拒绝结果</text>
  </g>

  <path d="M291 190h29 M584 190h29 M877 190h29" stroke="#73b5d9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="36" y="313" fill="#506b86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">任一角色完整通过即可；不能用甲角色的权限搭配乙角色的资源范围。</text>
</svg>
